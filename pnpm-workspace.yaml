packages:
  - "apps/*"
  - "packages/*"

# pnpm 11: approve dependency build scripts (replaces onlyBuiltDependencies).
# Required so Prisma/sharp/native postinstalls run during `pnpm install`,
# including in CI (Vercel) where ERR_PNPM_IGNORED_BUILDS is fatal.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: true
