packages:
  - "apps/*"
  - "packages/*"

# pnpm 11: approve dependency build scripts (replaces onlyBuiltDependencies).
# Required so native/postinstall scripts run during install, including in CI.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  protobufjs: true
